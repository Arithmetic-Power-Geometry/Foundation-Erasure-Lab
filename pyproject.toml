[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation-erasure-lab"
version = "0.2.0"
description = "Reproducible experiments for cryptographic foundation erasure and telescoping security."
requires-python = ">=3.10"
dependencies = ["cryptography>=46.0", "pqcrypto>=0.3.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
