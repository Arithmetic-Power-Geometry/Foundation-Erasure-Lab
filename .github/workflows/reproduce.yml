name: Reproduce Foundation-Erasure Experiments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest -q
      - name: Generate all research artifacts
        run: |
          python -m foundation_erasure.experiments.run_all --out results
          python -m foundation_erasure.experiments.multi_epoch --out results
          python -m foundation_erasure.experiments.real_crypto --out results
          python -m foundation_erasure.experiments.hard_collapse --out results
          python -m foundation_erasure.experiments.retirement_point --out results
          python -m foundation_erasure.experiments.verifier_trace --out results
          python -m foundation_erasure.experiments.executable_collapse --out results
      - name: Show summaries
        run: |
          cat results/comparison_summary.csv
          cat results/multi_epoch.csv
          cat results/real_crypto_performance.csv
          cat results/hard_collapse_matrix.csv
          cat results/retirement_point_matrix.csv
          cat results/verifier_trace.csv
          cat results/executable_collapse_attacks.csv
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-erasure-results
          path: results/
          retention-days: 90
