name: Reproduce Foundation-Erasure Experiments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Test
        run: pytest -q

      - name: Generate reproducible artifacts
        run: python -m foundation_erasure.experiments.run_all --out results\n          python -m foundation_erasure.experiments.multi_epoch --out results

      - name: Show generated results
        run: |
          cat results/foundation_erasure.csv
          cat results/attack_success.csv
          cat results/dependency_frontier.json

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundation-erasure-results
          path: results/
          retention-days: 90
